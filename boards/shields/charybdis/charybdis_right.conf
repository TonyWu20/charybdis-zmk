CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=2000
CONFIG_PMW3610_CPI_DIVIDOR=4
CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_PMW3610_SNIPE_CPI=800
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_ZMK_POINTING_SMOOTH_SCROLL_DIVISOR=128
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# Key event protection: filter abnormal repeated key events at the keymap.
# A press on a key that is already pressed, or less than 40 ms after the
# previous press of the same key, is dropped. A release without an active
# press is dropped. This catches switch chatter that survived kscan
# debouncing and duplicated position events from an unstable BLE split link.
CONFIG_ZMK_KEY_EVENT_GUARD=y
CONFIG_ZMK_KEY_EVENT_GUARD_MIN_INTERVAL_MS=40

CONFIG_PMW3610_SMART_ALGORITHM=y

# BLE split position resync: the central re-reads the left half's key state
# every 500 ms and corrects its own copy when they disagree. This releases
# a key on the host when a key release notification was lost in an unstable
# BLE link, instead of letting the host auto-repeat that key forever.
CONFIG_ZMK_SPLIT_BLE_POS_RESYNC_MS=500
